name: Shortcuts Library site

on:
  push:
    branches: [main]
    paths:
      - "shortcuts-library/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "shortcuts-library/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shortcuts-library/shortcuts.json
        run: |
          node -e '
            const list = JSON.parse(require("fs").readFileSync("shortcuts-library/shortcuts.json", "utf8"));
            if (!Array.isArray(list)) throw new Error("shortcuts.json must be an array");
            const ids = new Set();
            list.forEach((s, i) => {
              const where = "entry " + i + " (" + (s.id || "no id") + ")";
              for (const k of ["id", "title", "description", "platform"])
                if (!s[k] || typeof s[k] !== "string") throw new Error(where + ": missing " + k);
              if (!s.keys && !s.link) throw new Error(where + ": needs keys or link");
              if (s.link && !/^https?:\/\//.test(s.link)) throw new Error(where + ": link must be http(s)");
              if (ids.has(s.id)) throw new Error(where + ": duplicate id");
              ids.add(s.id);
            });
            console.log("OK: " + list.length + " shortcuts");
          '

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shortcuts-library
      - id: deployment
        uses: actions/deploy-pages@v4
