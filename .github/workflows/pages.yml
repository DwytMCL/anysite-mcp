name: Shortcut Library site

on:
  push:
    branches: [main]
    paths:
      - "library/**"
      - "shortcuts-library/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "library/**"
      - "shortcuts-library/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same check "npx anysite-mcp add" runs, against each library file, in a throwaway home.
      - name: Check library files
        shell: bash
        run: |
          export ANYSITE_HOME="$(mktemp -d)"
          for f in library/*.json; do
            node server.js add "$(basename "$f" .json)" --from "$f"
          done
      - name: Build site
        run: node shortcuts-library/build.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
