name: Shortcut Library site

on:
  push:
    branches: [main]
    paths:
      - "library/**"
      - "shortcuts-library/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "library/**"
      - "shortcuts-library/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same check "npx anysite-mcp add" runs, against each library file, in a throwaway home.
      - name: Check library files
        shell: bash
        run: |
          export ANYSITE_HOME="$(mktemp -d)"
          for f in library/*.json; do
            node server.js add "$(basename "$f" .json)" --from "$f"
          done
      - name: Build site
        run: node shortcuts-library/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
