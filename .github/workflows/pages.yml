name: Shortcut Library site

on:
  push:
    branches: [main]
    paths:
      - "library/**"
      - "shortcuts-library/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "library/**"
      - "shortcuts-library/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same check "npx anysite-mcp add" runs, against each library file, in a throwaway home.
      - name: Check library files
        shell: bash
        run: |
          export ANYSITE_HOME="$(mktemp -d)"
          for f in library/*.json; do
            node server.js add "$(basename "$f" .json)" --from "$f"
          done
      - name: Build site
        run: node shortcuts-library/build.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
