name: Prepare release

# Opens a release PR: bumps package.json, package-lock.json and server.json, and for a final release renames
# "## Unreleased" in CHANGELOG.md to the version. Merge it, then push the tag shown in the PR to publish.
# Safe to re-run: the release/v<version> branch belongs to this workflow and is replaced, and an open PR is reused.
# Needs "Allow GitHub Actions to create and approve pull requests" in the repo's Actions settings. CI on the PR then
# waits for "Approve workflows to run", because the PR is opened with GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Version bump. pre* starts an RC (0.4.0 → preminor → 0.5.0-rc.0). prerelease moves 0.5.0-rc.0 to
          0.5.0-rc.1, but on a stable 0.5.0 it starts 0.5.1-rc.0; use preminor or premajor for a new minor or
          major RC. To finish an RC, pick the same level again (minor turns 0.5.0-rc.0 into 0.5.0).
        type: choice
        required: true
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]

permissions:
  contents: write # push the release branch
  pull-requests: write # open the PR

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --preid rc --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          node scripts/prepare-release.js "$version"
          npm run check:versions -- --release
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Push release/v${{ steps.version.outputs.version }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "release: $VERSION"
          # The lease needs the remote branch's current commit, if a previous run pushed one.
          git fetch --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "HEAD:$branch"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="release/v$VERSION"
          existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then echo "The release PR is already open: $existing"; exit 0; fi
          {
            echo "Prepares the $VERSION release."
            echo
            echo "## Release notes"
            echo
            node scripts/release-notes.js "$VERSION"
            echo
            echo "## After merging"
            echo
            echo "Tag the merge commit to publish it:"
            echo
            echo '```sh'
            echo "git switch $BASE && git pull && git tag v$VERSION && git push origin v$VERSION"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base "$BASE" --head "$branch" --title "release: $VERSION" --body-file "$RUNNER_TEMP/body.md"
