name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selfcheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # GitHub's runners come with Google Chrome; the self-check runs it headless against a local page.
      - run: npm test
        timeout-minutes: 5
