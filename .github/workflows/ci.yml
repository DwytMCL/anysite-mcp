name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new Chrome or dependency release that breaks something shows up without a commit.
  schedule:
    - cron: '0 6 * * 1'
  # The release workflow runs this whole file against the tag before publishing.
  workflow_call:
    inputs:
      ref:
        description: Ref to test, e.g. refs/tags/v0.5.0
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # In a call from the release workflow github.workflow is "Release", so a release never cancels main's run.
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:versions
      - run: npm run check:licenses
      # Fails only on high or critical advisories in runtime dependencies, since lint is required on every PR.
      - run: npm run audit

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # A known Chrome rather than whatever the runner image happens to include. Not on macOS: setup-chrome unpacks
      # Chrome for Testing outside a .app bundle there, so its helpers are denied and no page loads. macOS uses the
      # runner's Google Chrome, found the way users' installs are.
      - name: Install Chrome
        if: runner.os != 'macOS'
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: false
      # Ubuntu 24.04's AppArmor blocks the user namespaces Chrome's sandbox needs for a Chrome outside the usual
      # install path ("No usable sandbox"). Allow them rather than run Chrome with --no-sandbox.
      - name: Allow Chrome's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # chrome.exe --version opens a browser on Windows instead of printing, so Windows logs the reported version.
      - name: Show Chrome
        shell: bash
        env:
          ANYSITE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chrome=$(node -e "import('./lib/browser.js').then(m => console.log(m.findChrome() || 'none'))")
          echo "anysite-mcp will use: $chrome"
          if [ "$RUNNER_OS" = "Windows" ]; then echo "Chrome ${{ steps.chrome.outputs.chrome-version }}"; else "$chrome" --version; fi
      - name: Unit tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        shell: bash
        run: |
          # Floor: lib/ line coverage was about 60% at v0.6.0 and is 80% now; below 75% fails.
          node --test --experimental-test-coverage --test-coverage-include="lib/**" --test-coverage-lines=75 --test-reporter=spec "test/*.test.js" | tee coverage.txt
          { echo '### Unit test coverage'; echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 24) }}
        run: npm run test:unit
      - name: Self-check
        run: npm run test:e2e
        timeout-minutes: 5
        env:
          ANYSITE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # Packs, installs and starts the package as npm would publish it.
      - name: Package smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:pack
        timeout-minutes: 5
        env:
          ANYSITE_CHROME: ${{ steps.chrome.outputs.chrome-path }}

  # A second MCP client, the MCP Inspector CLI (pinned in the script): the handshake, tool schemas with --strict, and
  # a tool call. The contract only, not the self-check: the Inspector starts a fresh server for every command. Node 24,
  # because the Inspector needs ^24.22.1.
  inspector:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The server looks for Chrome when it starts, so install it as the test job does.
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: false
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Inspector check
        run: npm run test:inspector
        timeout-minutes: 5
        env:
          ANYSITE_CHROME: ${{ steps.chrome.outputs.chrome-path }}

  # Node 18 and 20 must be refused at startup with a clear message, not a syntax error.
  node-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: server.js refuses Node 20
        shell: bash
        run: |
          out=$(node server.js --version 2>&1) && exit 1
          echo "$out"
          echo "$out" | grep -q "needs Node 22"
