name: Release

# Push a tag like v0.5.0 to run the checks, publish to npm and create a GitHub release from its CHANGELOG.md entry.
# npm publishing uses trusted publishing (OIDC): no token or security key, and npm adds provenance automatically.
# Run it by hand with an existing tag to finish a release whose publish didn't happen; steps already done are skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.4.0
        required: true

permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag looks like a release
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      # Trusted publishing needs npm 11.5.1 or newer, which comes with Node 24 (Node 22 has npm 10).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check:versions -- --release
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: Publish to npm
        run: |
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number);
            if (a * 1e6 + b * 1e3 + c < 11005001) { console.error('npm ' + process.argv[1] + ' is too old for trusted publishing'); process.exit(1); }" "$(npm --version)"
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "anysite-mcp@$version" version 2>/dev/null)" ]; then
            echo "anysite-mcp@$version is already on npm."
          else
            npm publish
          fi
      - name: GitHub release from CHANGELOG.md
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists."; exit 0; fi
          awk -v v="${TAG#v}" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
